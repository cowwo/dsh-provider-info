name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # npm Trusted Publishing 需要 OIDC 身份令牌

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || pnpm install --no-frozen-lockfile
      # Trusted Publishing: 通过 GitHub OIDC 自动认证，无需手动 NPM_TOKEN
      - run: npm publish --provenance --access public
